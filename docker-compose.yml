version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: legal_rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Ánh xạ vector_store và data từ máy thật vào container
      - ./app:/app/app
      - ./vector_store:/app/vector_store
      - ./data:/app/data
    healthcheck:
      disable: true   # <--- VÔ HIỆU HÓA HEALTHCHECK ĐỂ KHÔNG BỊ GIẾT
    networks:
      - rag_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: legal_rag_frontend
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://backend:8000/api/v1/chat/streaming
    depends_on:
      - backend       # <--- ĐỢI BACKEND CHẠY THƯỜNG, KHÔNG ÉP HEALTHCHECK
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge
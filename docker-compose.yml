services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: legal_rag_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./vector_store:/app/vector_store
      - ./data:/app/data
      - huggingface_cache:/root/.cache/huggingface
      - flashrank_cache:/tmp/legal-rag-flashrank
    networks:
      - rag_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: legal_rag_frontend
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      API_URL: http://backend:8000/api/v1/chat/streaming
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  huggingface_cache:
  flashrank_cache:
